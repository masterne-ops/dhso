/opt/so-data-analytics/logs/*.log
/opt/so-data-analytics/logs/*.err
{
    daily               # 按天滚动
    rotate 14           # 留 14 天
    compress            # gzip 压缩老日志
    delaycompress       # 上一份不压缩（方便看昨天的）
    missingok           # 文件不存在不报错
    notifempty          # 空文件不滚
    copytruncate        # 不重启 streamlit 也能滚（关键！）
    dateext             # 文件名带日期 .log-2026-05-10
    dateformat -%Y-%m-%d
    create 0644 root root
}
