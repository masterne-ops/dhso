limit_req_zone $binary_remote_addr zone=so_data_api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=so_data_api_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=so_data_api_resolver:10m rate=6r/m;

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 121.196.152.24;

    ssl_certificate /etc/so-data-api/tls/server.crt;
    ssl_certificate_key /etc/so-data-api/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SODataAPI:10m;
    ssl_session_timeout 10m;

    client_max_body_size 256k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    location = /v1/auth/login {
        limit_req zone=so_data_api_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8601;
        include proxy_params;
        proxy_read_timeout 15s;
    }

    location = /v1/resolve {
        limit_req zone=so_data_api_resolver burst=2 nodelay;
        proxy_pass http://127.0.0.1:8601;
        include proxy_params;
        proxy_read_timeout 100s;
        proxy_send_timeout 15s;
    }

    location / {
        limit_req zone=so_data_api_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8601;
        include proxy_params;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
